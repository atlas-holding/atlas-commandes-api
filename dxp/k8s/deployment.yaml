apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-commandes-api
  labels:
    app: atlas-commandes-api
    dxp.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-commandes-api
  template:
    metadata:
      labels:
        app: atlas-commandes-api
        backstage.io/kubernetes-id: atlas-commandes-api
    spec:
      nodeSelector:
        role: workload
      tolerations:
      - key: role
        operator: Equal
        value: workload
        effect: NoSchedule
      containers:
      - name: atlas-commandes-api
        image: harbor.dxp/dxp/atlas-commandes-api:latest
        imagePullPolicy: Always
        envFrom:
        # S105 -- token renomme (etait PLACEHOLDER_DB_SECRET, majuscules
        # + underscore invalides pour un nom K8s -- RFC 1123 -- faisait
        # echouer la sync ArgoCD pour TOUT service sans BDD liee, y compris
        # ceux deja e2e-valides). Substitue par dxp-app-link-database.yaml
        # uniquement si un service-ref database est ajoute apres coup.
        - secretRef:
            name: placeholder-db-secret
            optional: true
        env:
        - name: ALLOWED_ORIGINS
          value: ""
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-commandes-api
spec:
  selector:
    app: atlas-commandes-api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
